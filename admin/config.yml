backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

site_url: "https://imaginative-fenglisu-cefad4.netlify.app"
display_url: "https://imaginative-fenglisu-cefad4.netlify.app"

collections:
  - name: "content"
    label: "Контент сайту"
    files:
      - name: "site"
        label: "Alina English — сайт"
        file: "content/site.json"
        fields:
          - { label: "Назва сайту", name: "site", widget: object, fields: [
              { label: "Назва (логотип)", name: "name", widget: string }
            ] }

          - label: "Контакти сайту (використовуються в підвалі сайту та в блоці «Запис на урок»)"
            name: contacts
            widget: object
            fields:
              - { label: "Telegram (без @)", name: telegramUsername, widget: string }
              - { label: "Instagram (без @)", name: instagramUsername, widget: string }
              - { label: "Телефон", name: phone, widget: string }
              - { label: "Email", name: email, widget: string }

          - label: "SEO (заголовок і опис для Google, картинка для соцмереж)"
            name: seo
            widget: object
            fields:
              - { label: "Заголовок сторінки (title)", name: title, hint: "Показується у вкладці браузера і в результатах Google.", widget: object, fields: [
                  { label: "Українською", name: ua, widget: string },
                  { label: "English", name: en, widget: string }
                ] }
              - { label: "Опис сторінки (description)", name: description, hint: "Короткий текст під заголовком у результатах Google.", widget: object, fields: [
                  { label: "Українською", name: ua, widget: text },
                  { label: "English", name: en, widget: text }
                ] }
              - { label: "Зображення для соцмереж (og:image)", name: ogImage, widget: image, required: false, hint: "Показується при розшарюванні посилання в Facebook/Telegram/Viber. Залиште порожнім — автоматично використається фото Аліни з блоку Hero." }
              - { label: "Зображення для Twitter", name: twitterImage, widget: image, required: false, hint: "Залиште порожнім — автоматично використається те саме зображення, що й вище." }

          - label: "Кольори сайту (дизайн)"
            name: theme
            widget: object
            hint: "Змінюйте обережно — колір відразу впливає на весь сайт. Значення підбираються через графічний вибір кольору."
            fields:
              - { label: "Темно-зелений фон (шапка, hero, картки напрямків)", name: bgDark, widget: color }
              - { label: "Темно-зелений фон 2 (трохи світліший, смуга довіри)", name: bgDark2, widget: color }
              - { label: "Темно-зелений фон 3 (додатковий відтінок для градієнтів)", name: bgDark3, widget: color }
              - { label: "Помаранчевий (основні кнопки, акценти, іконка кроків)", name: orange, widget: color }
              - { label: "Помаранчевий при наведенні (hover)", name: orangeHover, widget: color }
              - { label: "М'ятний (акценти, активна мова, зірочки в темних блоках)", name: mint, widget: color }
              - { label: "М'ятний світлий (фон іконок, кружечків)", name: mintSoft, widget: color }
              - { label: "Кремовий (фон світлих секцій)", name: cream, widget: color }
              - { label: "Кремовий 2 (фон секцій «Ціни»/«Відгуки»)", name: cream2, widget: color }
              - { label: "Темний текст (основний текст на світлому фоні)", name: textDark, widget: color }
              - { label: "Приглушений темний текст (підписи, другорядний текст)", name: textMutedDark, widget: color }
              - { label: "Світлий текст (текст на темному фоні)", name: textLight, widget: color }
              - { label: "Приглушений світлий текст (підписи на темному фоні)", name: textMutedLight, widget: color }
              - { label: "Колір тонких рамок на світлому фоні", name: borderSoft, widget: color }

          - label: "Навігація"
            name: nav
            widget: object
            fields:
              - { label: "Напрямки", name: teach, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Про мене", name: about, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Формати", name: formats, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Відгуки", name: testimonials, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Питання", name: faq, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Кнопка запису", name: cta, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }

          - label: "Головний екран (Hero)"
            name: hero
            widget: object
            fields:
              - { label: "Фото Аліни", name: photo, widget: image, required: false, hint: "Головне фото зверху сайту. Якщо не завантажити — покажеться текст-плейсхолдер нижче." }
              - { label: "Плейсхолдер (якщо фото не завантажено)", name: photoPlaceholder, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Ярлик над заголовком", name: eyebrow, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - label: "Заголовок (H1)"
                name: h1
                widget: object
                fields:
                  - { label: "Українською (слово в *зірочках* виділяється кольором)", name: ua, widget: string }
                  - { label: "English (word in *asterisks* gets highlighted)", name: en, widget: string }
              - { label: "Підзаголовок", name: lead, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
              - { label: "Кнопка (основна)", name: btnPrimary, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Кнопка (Telegram)", name: btnOutline, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Рядок довіри (4.9/5 ...)", name: proof, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - label: "Статистика (4 плашки під кнопками — «12+ років», «500+ учнів» і т.д.)"
                name: stats
                hint: "Можна додавати/видаляти плашки — скільки тут пунктів, стільки й покажеться на сайті."
                widget: list
                fields:
                  - { label: "Число (коротко, напр. 12+ або Oxford)", name: num, widget: string }
                  - { label: "Підпис", name: label, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - label: "Плаваючі бейджі на фото (рівно 2 — верхній і нижній кружечок)"
                name: badges
                hint: "Це два кольорові кружечки, що «плавають» поверх фото Аліни (95% і 500+ на макеті). Має бути рівно 2 пункти."
                widget: list
                min: 2
                max: 2
                fields:
                  - { label: "Число", name: num, widget: string }
                  - { label: "Підпис", name: label, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }

          - label: "Секція «Чого я навчаю»"
            name: teach
            widget: object
            fields:
              - { label: "Ярлик", name: eyebrow, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Заголовок", name: h2, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Примітка внизу", name: note, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - label: "Картки напрямків"
                name: cards
                hint: "Кожна картка — один напрямок навчання (розмовна англійська, IELTS і т.д.). Можна додавати/видаляти/міняти місцями."
                widget: list
                fields:
                  - label: "Іконка"
                    name: icon
                    hint: "Маленька іконка у квадратику зверху картки"
                    widget: select
                    options:
                      - { label: "Мовна бульбашка", value: bubble }
                      - { label: "Документ / іспит", value: document }
                      - { label: "Будівля / бізнес", value: building }
                      - { label: "Шари / рівні", value: layers }
                      - { label: "Академічна шапка", value: cap }
                      - { label: "Мішень / ціль", value: target }
                  - { label: "Назва", name: t, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Опис", name: d, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }

          - label: "Смуга довіри (вузька темна смужка одразу під «Чого я навчаю» — «12+ років досвіду», «Сертифікат Oxford» тощо)"
            name: trust
            widget: object
            fields:
              - label: "Пункти"
                name: items
                hint: "Короткі пункти з галочкою в один рядок. Зазвичай 3-4 штуки."
                widget: list
                field: { label: "Пункт", name: item, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }

          - label: "Секція «Про мене»"
            name: about
            widget: object
            fields:
              - { label: "Фото Аліни", name: photo, widget: image, required: false, hint: "Фото в блоці «Про мене». Якщо не завантажити — покажеться текст-плейсхолдер нижче." }
              - { label: "Плейсхолдер (якщо фото не завантажено)", name: photoPlaceholder, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Число на бейджі", name: badgeNum, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Підпис на бейджі", name: badgeLbl, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Ярлик", name: eyebrow, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Заголовок", name: h2, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Абзац 1", name: p1, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
              - { label: "Абзац 2", name: p2, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
              - label: "Список переваг (чекліст)"
                name: checklist
                hint: "Короткі пункти з галочкою під текстом (зазвичай 3-4)."
                widget: list
                field: { label: "Пункт", name: item, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Кнопка", name: btn, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }

          - label: "Секція «Формати та ціни»"
            name: pricing
            widget: object
            fields:
              - { label: "Ярлик", name: eyebrow, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Заголовок", name: h2, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Опис", name: p, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
              - { label: "Примітка внизу", name: note, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Текст кнопки на картках", name: btnLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - label: "Тарифні картки"
                name: cards
                hint: "Зазвичай 3 картки: пробний урок, разове заняття, пакет. Позначте одну як «Виділена», щоб вона виділялась по центру."
                widget: list
                fields:
                  - { label: "Позначка (бейдж)", name: tag, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Назва", name: title, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Ціна", name: price, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Приписка до ціни (напр. / 60 хв)", name: priceSuffix, widget: object, required: false, fields: [{ label: UA, name: ua, widget: string, required: false }, { label: EN, name: en, widget: string, required: false }] }
                  - { label: "Виділена картка (по центру)", name: featured, widget: boolean, default: false, hint: "Робить картку темною, більшою і по центру — використовуйте лише для однієї, найпопулярнішої картки." }
                  - label: "Список опцій"
                    name: features
                    widget: list
                    field: { label: "Опція", name: item, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }

          - label: "Секція «Як це працює»"
            name: process
            widget: object
            fields:
              - { label: "Ярлик", name: eyebrow, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Заголовок", name: h2, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Примітка внизу", name: note, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
              - label: "Кроки"
                name: steps
                hint: "Номер кроку (1, 2, 3...) проставляється автоматично за порядком у списку."
                widget: list
                fields:
                  - { label: "Назва кроку", name: t, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Опис кроку", name: d, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }

          - label: "Секція «Відгуки»"
            name: testimonials
            widget: object
            fields:
              - { label: "Ярлик", name: eyebrow, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Заголовок", name: h2, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - label: "Відгуки"
                name: items
                hint: "Можна додавати/видаляти відгуки — вони прокручуються стрічкою на сайті автоматично."
                widget: list
                fields:
                  - { label: "Ініціал (буква на аватарі)", name: initial, widget: string, hint: "Одна літера, яка показується в кружечку замість фото учня." }
                  - { label: "Текст відгуку", name: quote, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
                  - { label: "Ім'я, вік", name: name, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Напрямок занять", name: role, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }

          - label: "Секція «Запис на урок»"
            name: booking
            widget: object
            fields:
              - { label: "Ярлик", name: eyebrow, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Заголовок", name: h2, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - { label: "Опис", name: p, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
              - { label: "Підпис «Телефон»", name: phoneLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
              - label: "Форма запису"
                name: form
                widget: object
                fields:
                  - { label: "Заголовок форми", name: h3, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Підзаголовок форми", name: sub, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Повідомлення про успіх", name: success, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
                  - { label: "Повідомлення про помилку", name: error, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
                  - { label: "Повідомлення «занадто рано» (антиспам, менше 3 хв з останньої заявки)", name: tooSoon, widget: object, fields: [{ label: UA, name: ua, widget: text }, { label: EN, name: en, widget: text }] }
                  - { label: "Підпис поля «Ім'я»", name: nameLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Плейсхолдер поля «Ім'я»", name: namePh, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Підпис поля «Контакт»", name: contactLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Плейсхолдер поля «Контакт»", name: contactPh, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Підпис «Ваш рівень»", name: levelLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - label: "Варіанти рівня"
                    name: levels
                    hint: "Список у випадаючому меню форми «Ваш рівень»."
                    widget: list
                    fields:
                      - { label: "Значення (латиницею, без пробілів)", name: value, widget: string, hint: "Технічний код, на сайті не показується. Просто не повторюйте однакові значення в межах списку." }
                      - { label: "Текст", name: label, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Підпис «Мета занять»", name: goalLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - label: "Варіанти мети"
                    name: goals
                    hint: "Список у випадаючому меню форми «Мета занять»."
                    widget: list
                    fields:
                      - { label: "Значення (латиницею, без пробілів)", name: value, widget: string, hint: "Технічний код, на сайті не показується. Просто не повторюйте однакові значення в межах списку." }
                      - { label: "Текст", name: label, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Підпис «Зручний час»", name: timeLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Плейсхолдер «Зручний час»", name: timePh, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Підпис «Коментар»", name: msgLabel, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Плейсхолдер «Коментар»", name: msgPh, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Текст кнопки «Надіслати»", name: submit, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
                  - { label: "Текст кнопки під час відправки", name: sending, widget: object, fields: [{ label: UA, name: ua, widget: string }, { label: EN, name: en, widget: string }] }
